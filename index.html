<!DOCTYPE html>
<html lang="pt-BR">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pizzaria Q-Delícia</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           BANNER PRINCIPAL
        ========================= */

        .hero {
            min-height: 760px;

            background-image:
                linear-gradient(
                    rgba(0,0,0,0.48),
                    rgba(0,0,0,0.88)
                ),
                url("fachada.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
        }


        /* =========================
           TÍTULO DO BANNER
        ========================= */

        .hero-title {
            font-family: Georgia, "Times New Roman", serif;

            font-weight: 900;

            color: #ff1616;

            text-shadow:
                3px 3px 0 #8b0000,
                5px 5px 8px rgba(0,0,0,0.8);

            text-transform: none;
        }


        /* =========================
           SUBTÍTULO
        ========================= */

        .hero-subtitle {
            font-family: Georgia, "Times New Roman", serif;

            font-weight: 700;

            color: white;

            text-transform: uppercase;

            text-shadow:
                2px 2px 4px rgba(0,0,0,0.9);
        }


        /* =========================
           INFORMAÇÕES
        ========================= */

        .info-line {
            display: flex;
            align-items: center;
            gap: 10px;

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 18px;

            line-height: 1.5;

            margin-bottom: 7px;
        }


        .info-icon {
            width: 28px;
            min-width: 28px;

            text-align: center;

            font-size: 21px;
        }


        .closed {
            color: #ff2222;

            font-weight: 700;
        }


        /* =========================
           BOTÕES
        ========================= */

        .btn-order {
            background: #ff1717;

            transition: 0.25s;

            box-shadow:
                0 5px 15px rgba(255,0,0,0.25);
        }

        .btn-order:hover {
            background: #d90000;

            transform: translateY(-2px);
        }


        .btn-menu {
            border: 2px solid white;

            transition: 0.25s;
        }

        .btn-menu:hover {
            background: white;

            color: black;
        }


        /* =========================
           BOTÕES DO CABEÇALHO
        ========================= */

        .header-btn {
            background: white;
            color: #c40000;

            padding: 8px 16px;

            border-radius: 8px;

            font-weight: bold;

            transition: 0.25s;
        }

        .header-btn:hover {
            background: #ffe5e5;
            color: #a00000;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .hero {
                min-height: 800px;

                background-position: center;
            }


            .hero-title {
                font-size: 32px;

                line-height: 1.1;
            }


            .hero-subtitle {
                font-size: 17px;

                line-height: 1.25;
            }


            .info-line {
                font-size: 16px;

                gap: 8px;
            }


            .info-icon {
                font-size: 19px;

                width: 25px;

                min-width: 25px;
            }

        }

    </style>

</head>
