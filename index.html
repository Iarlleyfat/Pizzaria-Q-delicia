<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pizzaria Q-Delícia</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           BANNER PRINCIPAL
        ========================= */

        .hero {
            min-height: 760px;

            background-image:
                linear-gradient(
                    rgba(0,0,0,0.48),
                    rgba(0,0,0,0.88)
                ),
                url("fachada.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
        }


        /* =========================
           TÍTULO DO BANNER
        ========================= */

        .hero-title {
            font-family: Georgia, "Times New Roman", serif;

            font-weight: 900;

            color: #ff1616;

            text-shadow:
                3px 3px 0 #8b0000,
                5px 5px 8px rgba(0,0,0,0.8);

            text-transform: none;
        }


        /* =========================
           NOME DA PIZZARIA
        ========================= */

        .pizzaria-name {
            font-family: Georgia, "Times New Roman", serif;

            font-weight: 900;

            color: white;

            text-shadow:
                2px 2px 5px rgba(0,0,0,0.9);
        }


        /* =========================
           SUBTÍTULO
        ========================= */

        .hero-subtitle {
            font-family: Georgia, "Times New Roman", serif;

            font-weight: 700;

            color: white;

            text-transform: uppercase;

            text-shadow:
                2px 2px 4px rgba(0,0,0,0.9);
        }


        /* =========================
           INFORMAÇÕES
        ========================= */

        .info-line {
            display: flex;
            align-items: center;
            gap: 10px;

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 18px;

            line-height: 1.5;

            margin-bottom: 7px;
        }


        .info-icon {
            width: 28px;
            min-width: 28px;

            text-align: center;

            font-size: 21px;
        }


        .closed {
            color: #ff2222;

            font-weight: 700;
        }


        /* =========================
           BOTÕES
        ========================= */

        .btn-order {
            background: #ff1717;

            transition: 0.25s;

            box-shadow:
                0 5px 15px rgba(255,0,0,0.25);
        }

        .btn-order:hover {
            background: #d90000;

            transform: translateY(-2px);
        }
