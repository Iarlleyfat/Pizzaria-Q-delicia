<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Pizzaria Q-Delícia</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {

        }

        /* CABEÇALHO */
        .header-btn {
            color: white;
            transition: 0.25s;
            font-weight: 600;
        }

        .header-btn:hover {

        }

        /* HERO */
        .hero {
            position: relative;
            min-height: 100vh;
            background-image: url("fachada.jpg");
            background-size: cover;
            background-position: center;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-title {
            color: #ef4444;
            font-weight: 900;
        }

        .btn-order {
            background: #dc2626;
            color: white;
            transition: 0.25s;
        }

        .btn-order:hover {
            background: #b91c1c;
            transform: scale(1.03);
        }

        .btn-menu {
            background: white;
            color: #dc2626;
            transition: 0.25s;
        }

        .btn-menu:hover {
            background: #f3f4f6;
            transform: scale(1.03);
        }
    </style>
</head>
